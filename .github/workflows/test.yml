on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test plan diffs a PR against its merge base with the base branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Plan tests
        # A PR runs the tests its changes can reach (bivium.config.ts); a push
        # to master skips this step, so every test runs.
        id: plan
        if: github.event_name == 'pull_request'
        run: bunx --bun bivium plan origin/${{ github.base_ref }} --github

      - name: Lint and format
        run: bun run lint

      - name: Check the test plan can read every test's inputs
        run: bunx --bun bivium check --max-unknown 0

      - name: Unused files, exports and dependencies
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        if: steps.plan.outputs.unit-tests != 'none'
        run: bun test --parallel ${{ steps.plan.outputs.unit-tests != 'all' && steps.plan.outputs.unit-tests || './tests' }}
      - name: Test the packed package
        run: bun run test:package
